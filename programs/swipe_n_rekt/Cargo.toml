[package]
name = "swipe_n_rekt"
version = "0.1.0"
description = "Swipe n Rekt — on-chain escrow, oracle settlement, reward pool & cNFT cards (Solana/Anchor)"
edition = "2021"


[lib]
crate-type = ["cdylib", "lib"]
name = "swipe_n_rekt"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
